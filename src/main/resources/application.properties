spring.application.name=helpdesk

# Cấu hình Port cho Cloud (Render sẽ tự cấp PORT, nếu chạy local sẽ mặc định là 8080)
server.port=${PORT:8080}

# ===== Database MySQL =====
# Đọc thông số từ biến môi trường (Environment Variables) khi deploy
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:helpdesk_qnu}?useSSL=true&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
# Tắt show-sql trên production để tránh tràn log
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== Thymeleaf =====
# Bật cache để tăng tốc độ tải trang trên Cloud
spring.thymeleaf.cache=true           
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ===== Upload file =====
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads/

# ===== Logging =====
logging.level.org.springframework.security=INFO
logging.level.edu.qnu.helpdesk=INFO