<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tra cứu yêu cầu | Service Desk QNU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/public.css}" rel="stylesheet">
</head>
<body class="public-page">

<header class="public-header">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center py-3">
            <a href="/" class="public-logo text-decoration-none">
                <i class="bi bi-headset"></i>
                <span>Service Desk - Trường Đại học Quy Nhơn</span>
            </a>
            <a th:href="@{/login}" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
            </a>
        </div>
    </div>
    <div class="public-breadcrumb">
        <div class="container">
            <nav>
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="/">Trang chủ</a></li>
                    <li class="breadcrumb-item active">Tra cứu yêu cầu</li>
                </ol>
            </nav>
        </div>
    </div>
</header>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-xl-5">

            <div class="text-center mb-4">
                <div class="page-icon-circle mb-3">
                    <i class="bi bi-file-earmark-text"></i>
                </div>
                <h3 class="fw-bold mb-1">Tra cứu yêu cầu đã gửi</h3>
                <p class="text-muted">Nhập mã tra cứu và email để xem tiến độ xử lý</p>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <div th:if="${errorMessage}" class="alert alert-danger py-2 small">
                        <i class="bi bi-exclamation-circle me-1"></i>
                        <span th:text="${errorMessage}">Lỗi</span>
                    </div>

                    <form th:action="@{/view-ticket}" th:object="${request}" method="post">

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">
                                Mã tra cứu <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="bi bi-key"></i>
                                </span>
                                <input type="text" th:field="*{trackingCode}"
                                       class="form-control"
                                       placeholder="VD: QNU-20250115-AB12CD"
                                       required autofocus>
                            </div>
                            <div th:if="${#fields.hasErrors('trackingCode')}"
                                 th:errors="*{trackingCode}" class="text-danger small mt-1"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-semibold">
                                Email <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text bg-light">
                                    <i class="bi bi-envelope"></i>
                                </span>
                                <input type="email" th:field="*{email}"
                                       class="form-control"
                                       placeholder="email đã dùng để gửi yêu cầu"
                                       required>
                            </div>
                            <div th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}" class="text-danger small mt-1"></div>
                        </div>

                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="rememberEmail">
                            <label class="form-check-label small" for="rememberEmail">
                                Ghi nhớ email của tôi
                            </label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                            <i class="bi bi-search me-1"></i> Tra cứu
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <a th:href="@{/submit-ticket}" class="text-decoration-none small">
                            <i class="bi bi-plus-circle"></i> Gửi yêu cầu mới
                        </a>
                    </div>

                    <hr class="my-4">

                    <div class="text-center">
                        <small class="text-muted">
                            <i class="bi bi-question-circle"></i>
                            Quên mã tra cứu?
                            <a th:href="@{/contact}" class="text-decoration-none fw-semibold ms-1">
                                Liên hệ hỗ trợ
                            </a>
                        </small>
                    </div>

                </div>
            </div>

            <div class="text-center mt-4">
                <a th:href="@{/}" class="text-decoration-none text-muted small">
                    <i class="bi bi-arrow-left"></i> Quay lại trang chủ
                </a>
            </div>

        </div>
    </div>
</main>

<script>
// Nhớ email
document.addEventListener('DOMContentLoaded', function() {
    const remember = document.getElementById('rememberEmail');
    const emailInput = document.querySelector('input[name="email"]');
    const saved = localStorage.getItem('guestEmail');
    if (saved) {
        emailInput.value = saved;
        remember.checked = true;
    }
    remember.addEventListener('change', function() {
        if (this.checked) {
            localStorage.setItem('guestEmail', emailInput.value);
        } else {
            localStorage.removeItem('guestEmail');
        }
    });
});
</script>
</body>
</html>
