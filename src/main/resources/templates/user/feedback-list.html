<!-- Trang danh sách phản hồi Admin -->

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/fragments :: head('Phản hồi của tôi')}"></head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{layout/fragments :: navbar}"></div>
<div th:replace="~{layout/fragments :: alerts}"></div>

<main class="container py-4 flex-grow-1">

    <div class="page-header mb-4">
        <div>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-1">
                    <li class="breadcrumb-item"><a th:href="@{/user/home}">Trang chủ</a></li>
                    <li class="breadcrumb-item active">Phản hồi của tôi</li>
                </ol>
            </nav>
            <h3 class="fw-bold mb-0">
                <i class="bi bi-list-ul text-primary me-1"></i>
                Phản hồi của tôi
            </h3>
        </div>
        <a th:href="@{/user/feedbacks/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i> Gửi phản hồi mới
        </a>
    </div>

    <!-- Empty state -->
    <div th:if="${feedbackPage.isEmpty()}" class="empty-state">
        <div class="empty-icon">
            <i class="bi bi-inbox"></i>
        </div>
        <h5 class="fw-bold mt-4">Chưa có phản hồi nào</h5>
        <p class="text-muted mb-4">
            Bạn chưa gửi phản hồi nào. Hãy bắt đầu bằng cách gửi yêu cầu hỗ trợ đầu tiên.
        </p>
        <a th:href="@{/user/feedbacks/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i> Gửi phản hồi đầu tiên
        </a>
    </div>

    <!-- Danh sách -->
    <div th:unless="${feedbackPage.isEmpty()}">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 70px;">Mã</th>
                                <th>Tiêu đề</th>
                                <th style="width: 170px;">Danh mục</th>
                                <th style="width: 130px;">Trạng thái</th>
                                <th style="width: 150px;">Ngày gửi</th>
                                <th style="width: 70px;" class="text-center"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="fb : ${feedbackPage.content}">
                                <td>
                                    <span class="badge bg-primary-subtle text-primary fw-bold"
                                          th:text="'#' + ${fb.id}">#1</span>
                                </td>
                                <td>
                                    <a th:href="@{'/user/feedbacks/' + ${fb.id}}"
                                       class="text-decoration-none fw-semibold text-dark d-block"
                                       th:text="${fb.title}">Tiêu đề</a>
                                    <small th:if="${fb.attachment != null}" class="text-muted">
                                        <i class="bi bi-paperclip"></i> Có tệp đính kèm
                                    </small>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border"
                                          th:text="${fb.category?.label}">Học vụ</span>
                                </td>
                                <td>
                                    <span class="badge"
                                          th:classappend="'bg-' + ${fb.status.badgeClass}"
                                          th:text="${fb.status.label}">Chờ xử lý</span>
                                </td>
                                <td class="text-muted small"
                                    th:text="${#temporals.format(fb.createdAt, 'dd/MM/yyyy HH:mm')}">
                                    01/01/2025
                                </td>
                                <td class="text-center">
                                    <a th:href="@{'/user/feedbacks/' + ${fb.id}}"
                                       class="btn btn-sm btn-light border" title="Xem chi tiết">
                                        <i class="bi bi-chevron-right"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <div th:if="${totalPages > 1}" class="card-footer bg-white border-top">
                <nav>
                    <ul class="pagination justify-content-center mb-0">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                            <a class="page-link" th:href="@{/user/feedbacks(page=${currentPage - 1})}">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>
                        <li class="page-item"
                            th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                            th:classappend="${i == currentPage} ? 'active'">
                            <a class="page-link"
                               th:href="@{/user/feedbacks(page=${i})}"
                               th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                            <a class="page-link" th:href="@{/user/feedbacks(page=${currentPage + 1})}">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>

</main>

<div th:replace="~{layout/fragments :: footer}"></div>
<th:block th:replace="~{layout/fragments :: scripts}"></th:block>
</body>
</html>
