<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Chọn danh mục | Service Desk QNU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link th:href="@{/css/public.css}" rel="stylesheet">
</head>
<body class="public-page">

<!-- Header giống trang chủ -->
<header class="public-header">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center py-3">
            <a href="/" class="public-logo text-decoration-none">
                <i class="bi bi-headset"></i>
                <span>Service Desk - Trường Đại học Quy Nhơn</span>
            </a>
            <a th:href="@{/login}" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
            </a>
        </div>
    </div>
    <div class="public-breadcrumb">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="/">Trang chủ</a></li>
                    <li class="breadcrumb-item active">Gửi yêu cầu</li>
                </ol>
            </nav>
        </div>
    </div>
</header>

<main class="container py-5">
    <div class="text-center mb-5">
        <h2 class="fw-bold">Chúng tôi có thể giúp gì cho bạn?</h2>
        <p class="text-muted">Chọn danh mục phù hợp với vấn đề của bạn</p>
    </div>

    <div class="row g-3 justify-content-center">
        <div class="col-md-6 col-lg-5" th:each="cat : ${categories}">
            <a th:href="@{'/submit-ticket/' + ${cat.name()}}"
               class="category-card text-decoration-none">
                <div class="category-icon">
                    <i class="bi" th:classappend="${cat.icon}"></i>
                </div>
                <div class="category-content">
                    <h6 class="fw-bold mb-1" th:text="${cat.label}">Tài khoản Email</h6>
                    <p class="small text-muted mb-0" th:text="${cat.description}">
                        Mô tả ngắn
                    </p>
                </div>
                <i class="bi bi-chevron-right category-arrow"></i>
            </a>
        </div>
    </div>

    <div class="text-center mt-5">
        <a th:href="@{/}" class="text-decoration-none">
            <i class="bi bi-arrow-left"></i> Quay lại trang chủ
        </a>
    </div>
</main>

</body>
</html>
