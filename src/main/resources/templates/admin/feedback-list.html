<!-- Trang phản hồi User -->

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/fragments :: head('Quản lý phản hồi')}"></head>
<body class="d-flex flex-column min-vh-100">

<div th:replace="~{layout/fragments :: navbar}"></div>
<div th:replace="~{layout/fragments :: alerts}"></div>

<main class="container py-4 flex-grow-1">

    <div class="page-header mb-4">
        <div>
            <h3 class="fw-bold mb-1">
                <i class="bi bi-inbox text-primary me-1"></i> Quản lý phản hồi
            </h3>
            <p class="text-muted mb-0">Theo dõi và xử lý tất cả phản hồi từ người dùng</p>
        </div>
    </div>

    <!-- Filter -->
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body p-3">
            <form th:action="@{/admin/feedbacks}" method="get" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small fw-semibold mb-1">Trạng thái</label>
                    <select name="status" class="form-select form-select-sm">
                        <option value="">Tất cả trạng thái</option>
                        <option th:each="s : ${statuses}"
                                th:value="${s}"
                                th:text="${s.label}"
                                th:selected="${status != null && status == s}">
                            Chờ xử lý
                        </option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label small fw-semibold mb-1">Từ khóa</label>
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                        <input type="text" name="keyword" class="form-control"
                               th:value="${keyword}" placeholder="Tìm theo tiêu đề hoặc nội dung...">
                    </div>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary btn-sm w-100">
                        <i class="bi bi-funnel me-1"></i> Lọc
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bảng -->
    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <!-- Empty -->
            <div th:if="${feedbackPage.isEmpty()}" class="text-center py-5">
                <div class="empty-icon-sm mx-auto">
                    <i class="bi bi-inbox text-muted"></i>
                </div>
                <h6 class="fw-bold mt-3 mb-1">Không có phản hồi nào</h6>
                <p class="text-muted small mb-0">Không tìm thấy phản hồi phù hợp với bộ lọc.</p>
            </div>

            <!-- Table -->
            <div th:unless="${feedbackPage.isEmpty()}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th style="width: 70px;">Mã</th>
                            <th>Tiêu đề</th>
                            <th style="width: 170px;">Người gửi</th>
                            <th style="width: 150px;">Danh mục</th>
                            <th style="width: 130px;">Trạng thái</th>
                            <th style="width: 140px;">Ngày gửi</th>
                            <th style="width: 70px;" class="text-center"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="fb : ${feedbackPage.content}">
                            <td>
                                <span class="badge bg-primary-subtle text-primary fw-bold"
                                      th:text="'#' + ${fb.id}">#1</span>
                            </td>
                            <td>
                                <a th:href="@{'/admin/feedbacks/' + ${fb.id}}"
                                   class="text-decoration-none fw-semibold text-dark d-block"
                                   th:text="${fb.title}">Tiêu đề</a>
                                <small th:if="${fb.priority == 3}" class="text-danger">
                                    <i class="bi bi-exclamation-triangle-fill"></i> Ưu tiên cao
                                </small>
                            </td>
                            <td>
                                <div class="fw-semibold" th:text="${fb.displayName}">Nguyễn Văn A</div>
                            </td>
                            <td>
                                <span class="badge bg-light text-dark border"
                                      th:text="${fb.category?.label}">Học vụ</span>
                            </td>
                            <td>
                                <span class="badge"
                                      th:classappend="'bg-' + ${fb.status.badgeClass}"
                                      th:text="${fb.status.label}">Chờ xử lý</span>
                            </td>
                            <td class="small text-muted"
                                th:text="${#temporals.format(fb.createdAt, 'dd/MM/yyyy HH:mm')}">
                                01/01/2025
                            </td>
                            <td class="text-center">
                                <a th:href="@{'/admin/feedbacks/' + ${fb.id}}"
                                   class="btn btn-sm btn-primary" title="Xử lý">
                                    <i class="bi bi-reply"></i>
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <div th:if="${totalPages > 1}" class="card-footer bg-white border-top">
            <nav>
                <ul class="pagination justify-content-center mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/feedbacks(page=${currentPage - 1}, status=${status}, keyword=${keyword})}">
                            <i class="bi bi-chevron-left"></i>
                        </a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link"
                           th:href="@{/admin/feedbacks(page=${i}, status=${status}, keyword=${keyword})}"
                           th:text="${i + 1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{/admin/feedbacks(page=${currentPage + 1}, status=${status}, keyword=${keyword})}">
                            <i class="bi bi-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</main>

<div th:replace="~{layout/fragments :: footer}"></div>
<th:block th:replace="~{layout/fragments :: scripts}"></th:block>
</body>
</html>
