<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Gửi yêu cầu thành công | Service Desk QNU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link th:href="@{/css/public.css}" rel="stylesheet">
</head>
<body class="public-page d-flex flex-column min-vh-100">

<header class="public-header">
    <div class="container d-flex justify-content-between align-items-center py-3">
        <a href="/" class="public-logo text-decoration-none">
            <i class="bi bi-headset"></i> <span>Service Desk - Trường Đại học Quy Nhơn</span>
        </a>
    </div>
</header>

<main class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="card border-0 shadow-sm" style="max-width: 500px; width: 100%;">
        <div class="card-body p-5 text-center">
            <div class="success-icon-circle mb-4">
                <i class="bi bi-check2-circle"></i>
            </div>
            <h3 class="fw-bold mb-2">Đã gửi yêu cầu thành công!</h3>
            <p class="text-muted mb-4">
                Yêu cầu cấp mới Email trường đã được chuyển đến Trung tâm Số & Học liệu.
                Vui lòng chờ phản hồi qua Email cá nhân trong 1-2 ngày làm việc.
            </p>

            <div class="d-grid gap-2 mt-4">
                <a th:href="@{/dich-vu/tra-cuu}" class="btn btn-primary">
                    <i class="bi bi-search"></i> Tiếp tục Tra cứu
                </a>
                <a th:href="@{/}" class="btn btn-light border">
                    <i class="bi bi-house"></i> Về trang chủ
                </a>
            </div>
        </div>
    </div>
</main>

<footer class="public-footer py-4 mt-auto">
    <div class="container text-center small text-muted">
        &copy; 2025 Trường Đại học Quy Nhơn. Bảo lưu mọi quyền.
    </div>
</footer>

</body>
</html>
