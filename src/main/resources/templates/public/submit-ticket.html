<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Gửi yêu cầu | Service Desk QNU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link th:href="@{/css/public.css}" rel="stylesheet">
</head>
<body class="public-page">

<header class="public-header">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center py-3">
            <a href="/" class="public-logo text-decoration-none">
                <i class="bi bi-headset"></i>
                <span>Service Desk - Trường Đại học Quy Nhơn</span>
            </a>
            <a th:href="@{/login}" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Đăng nhập
            </a>
        </div>
    </div>
    <div class="public-breadcrumb">
        <div class="container">
            <nav>
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a href="/">Trang chủ</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/submit-ticket}">Gửi yêu cầu</a></li>
                    <li class="breadcrumb-item active" th:text="${category.label}">Danh mục</li>
                </ol>
            </nav>
        </div>
    </div>
</header>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-9 col-xl-8">

            <!-- Category header -->
            <div class="category-header-card mb-4">
                <div class="category-header-icon">
                    <i class="bi" th:classappend="${category.icon}"></i>
                </div>
                <div>
                    <h4 class="fw-bold mb-1" th:text="${category.label}">Danh mục</h4>
                    <p class="text-muted mb-0 small" th:text="${category.description}">
                        Mô tả
                    </p>
                </div>
            </div>

            <!-- Error -->
            <div th:if="${errorMessage}" class="alert alert-danger">
                <i class="bi bi-exclamation-circle me-1"></i>
                <span th:text="${errorMessage}">Lỗi</span>
            </div>

            <!-- Form -->
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <h5 class="fw-bold mb-4">
                        <i class="bi bi-pencil-square text-primary me-1"></i>
                        Thông tin yêu cầu
                    </h5>

                    <form th:action="@{/submit-ticket}"
                          th:object="${request}"
                          method="post"
                          enctype="multipart/form-data">

                        <input type="hidden" th:field="*{category}">

                        <!-- Họ tên -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-semibold">
                                    Họ và tên <span class="text-danger">*</span>
                                </label>
                                <input type="text" th:field="*{fullName}" class="form-control"
                                       placeholder="VD: Nguyễn Văn A" required>
                                <div th:if="${#fields.hasErrors('fullName')}"
                                     th:errors="*{fullName}" class="text-danger small mt-1"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label small fw-semibold">
                                    Email <span class="text-danger">*</span>
                                </label>
                                <input type="email" th:field="*{email}" class="form-control"
                                       placeholder="email@qnu.edu.vn" required>
                                <div class="form-text small">
                                    <i class="bi bi-info-circle"></i>
                                    Email dùng để tra cứu và nhận phản hồi
                                </div>
                                <div th:if="${#fields.hasErrors('email')}"
                                     th:errors="*{email}" class="text-danger small mt-1"></div>
                            </div>
                        </div>

                        <!-- SĐT -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Số điện thoại</label>
                            <input type="text" th:field="*{phone}" class="form-control"
                                   placeholder="VD: 0123456789">
                            <div th:if="${#fields.hasErrors('phone')}"
                                 th:errors="*{phone}" class="text-danger small mt-1"></div>
                        </div>

                        <!-- Tiêu đề -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">
                                Tiêu đề <span class="text-danger">*</span>
                            </label>
                            <input type="text" th:field="*{title}" class="form-control"
                                   placeholder="VD: Không đăng nhập được Wifi KTX" required>
                            <div th:if="${#fields.hasErrors('title')}"
                                 th:errors="*{title}" class="text-danger small mt-1"></div>
                        </div>

                        <!-- Nội dung -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">
                                Mô tả chi tiết <span class="text-danger">*</span>
                            </label>
                            <textarea th:field="*{content}" class="form-control" rows="6"
                                      placeholder="Mô tả chi tiết vấn đề (VD: Mã sinh viên, thời gian gặp sự cố, thông báo lỗi...)"
                                      required></textarea>
                            <div class="form-text small">Tối thiểu 10 ký tự</div>
                            <div th:if="${#fields.hasErrors('content')}"
                                 th:errors="*{content}" class="text-danger small mt-1"></div>
                        </div>

                        <!-- File -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">
                                <i class="bi bi-paperclip"></i> Tệp đính kèm
                                <span class="text-muted fw-normal">(tùy chọn)</span>
                            </label>
                            <input type="file" th:field="*{attachment}" class="form-control"
                                   accept=".jpg,.jpeg,.png,.gif,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip">
                            <div class="form-text small">
                                Định dạng: JPG, PNG, PDF, DOCX, XLSX, ZIP... Tối đa 5MB.
                            </div>
                        </div>

                        <!-- Priority -->
                        <div class="mb-4">
                            <label class="form-label small fw-semibold">Mức độ ưu tiên</label>
                            <select th:field="*{priority}" class="form-select">
                                <option value="1">🟢 Thấp - Không gấp</option>
                                <option value="2" selected>🟡 Bình thường</option>
                                <option value="3">🔴 Cao - Cần xử lý gấp</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-between gap-2">
                            <a th:href="@{/submit-ticket}" class="btn btn-light border">
                                <i class="bi bi-arrow-left me-1"></i> Quay lại
                            </a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-send me-1"></i> Gửi yêu cầu
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
