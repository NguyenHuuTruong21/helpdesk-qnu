<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/fragments :: head('Lỗi hệ thống')}"></head>
<body class="error-page">

<div class="error-container">
    <div class="error-icon error-icon-danger">
        <i class="bi bi-bug"></i>
    </div>
    <h1 class="error-code">500</h1>
    <h4 class="fw-bold mb-2">Đã xảy ra lỗi hệ thống</h4>
    <p class="text-muted mb-4">
        Rất tiếc, đã xảy ra lỗi. Vui lòng thử lại sau hoặc liên hệ quản trị viên.
    </p>
    <a th:href="@{/}" class="btn btn-primary">
        <i class="bi bi-house me-1"></i> Về trang chủ
    </a>
</div>
</body>
</html>
