<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/fragments :: head('Yêu cầu không hợp lệ')}"></head>
<body class="error-page">

<div class="error-container">
    <div class="error-icon error-icon-warning">
        <i class="bi bi-exclamation-octagon"></i>
    </div>
    <h1 class="error-code">400</h1>
    <h4 class="fw-bold mb-2">Yêu cầu không hợp lệ</h4>
    <p class="text-muted mb-4">
        Dữ liệu bạn gửi lên không hợp lệ. Vui lòng kiểm tra lại.
    </p>
    <a th:href="@{/}" class="btn btn-primary">
        <i class="bi bi-house me-1"></i> Về trang chủ
    </a>
</div>
</body>
</html>
