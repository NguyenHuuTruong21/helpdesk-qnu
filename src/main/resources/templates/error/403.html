<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{layout/fragments :: head('Không có quyền')}"></head>
<body class="error-page">

<div class="error-container">
    <div class="error-icon error-icon-danger">
        <i class="bi bi-shield-lock"></i>
    </div>
    <h1 class="error-code">403</h1>
    <h4 class="fw-bold mb-2">Không có quyền truy cập</h4>
    <p class="text-muted mb-4">
        Bạn không có quyền truy cập vào trang này. Vui lòng liên hệ quản trị viên.
    </p>
    <a th:href="@{/}" class="btn btn-primary">
        <i class="bi bi-house me-1"></i> Về trang chủ
    </a>
</div>
</body>
</html>
